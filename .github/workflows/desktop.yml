name: Windows desktop build

on:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/cpp/**"
      - "app/src/main/java/com/allmeyn/player/library/Models.kt"   # compiled into the desktop app
      - "app/src/main/java/com/allmeyn/player/dsp/DspParams.kt"
      - "app/src/main/java/com/allmeyn/player/library/PlaylistOps.kt"
      - "app/src/main/java/com/allmeyn/player/dsp/EqProfile.kt"
      - "app/src/main/java/com/allmeyn/player/ui/HeadphoneEqEditor.kt"
      - "app/src/main/res/drawable/ic_brand_mark.xml"
      - "branding/**"
      - "scripts/build-ffmpeg-desktop.sh"
      - "app/src/androidTest/assets/**"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
      - "version.txt"
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/cpp/**"
      - "app/src/main/java/com/allmeyn/player/library/Models.kt"   # compiled into the desktop app
      - "app/src/main/java/com/allmeyn/player/dsp/DspParams.kt"
      - "app/src/main/java/com/allmeyn/player/library/PlaylistOps.kt"
      - "app/src/main/java/com/allmeyn/player/dsp/EqProfile.kt"
      - "app/src/main/java/com/allmeyn/player/ui/HeadphoneEqEditor.kt"
      - "app/src/main/res/drawable/ic_brand_mark.xml"
      - "branding/**"
      - "scripts/build-ffmpeg-desktop.sh"
      - "app/src/androidTest/assets/**"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
      - "version.txt"
  workflow_dispatch:
  workflow_call:  # release.yml builds the installer with this same workflow

# Least privilege: the build only reads the repository (artifacts and caches use their own tokens).
permissions:
  contents: read

jobs:
  # The engine DLL is cross-compiled on Linux with MinGW-w64 (fast, and the same way it's built
  # and checked locally), then handed to the Windows job.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5   # jni.h for the engine
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Cache FFmpeg (Windows + Linux)
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: desktop/native/ffmpeg
          key: ffmpeg-desktop-${{ hashFiles('scripts/build-ffmpeg-desktop.sh') }}

      - name: Build FFmpeg (Windows + Linux)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-ffmpeg-desktop.sh windows
          scripts/build-ffmpeg-desktop.sh linux

      # Sources and player on Linux with the same FFmpeg: lossless clips bit-exact (the Android test's
      # hashes), sample-accurate seeks, DSD, the player's threads (ASan/UBSan, then TSan).
      - name: Engine core tests (Linux)
        run: |
          for san in "address,undefined" thread; do
            dir="build/desktop-tests-${san%%,*}"
            cmake -S desktop/native -B "$dir" -DALLMEYN_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_FLAGS="-fsanitize=$san" -DCMAKE_CXX_FLAGS="-fsanitize=$san -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=$san"
            cmake --build "$dir" -j
            "$dir/desktop_core_test"
          done

      - name: Build the engine DLL
        run: |
          cmake -S desktop/native -B build/desktop-native -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/desktop/native/cmake/mingw-w64.cmake" \
            -DJDK_INCLUDE="$JAVA_HOME/include"
          cmake --build build/desktop-native -j

      - name: Check the DLL only needs Windows system libraries
        run: |
          deps=$(x86_64-w64-mingw32-objdump -p build/desktop-native/allmeyn_desktop.dll | awk '/DLL Name/ {print tolower($3)}' | sort -u | tr '\n' ' ')
          echo "imports: $deps"
          for d in $deps; do
            case "$d" in kernel32.dll|msvcrt.dll|ole32.dll|bcrypt.dll|user32.dll|advapi32.dll|avrt.dll|ksuser.dll|dwmapi.dll) ;;
              *) echo "unexpected DLL dependency: $d"; exit 1 ;; esac
          done
          x86_64-w64-mingw32-objdump -p build/desktop-native/allmeyn_desktop.dll | grep -q Java_com_allmeyn_desktop_engine_NativeEngine_ffmpegVersion

      - uses: actions/upload-artifact@v6
        with:
          name: allmeyn-desktop-engine
          path: build/desktop-native/allmeyn_desktop.dll

  app:
    needs: native
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: allmeyn-desktop-engine
          path: desktop/resources/windows-x64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (incl. loading the real engine DLL) and the installer
        run: ./gradlew --no-daemon -p desktop test createDistributable packageMsi

      - name: Check the engine DLL tests ran (not skipped)
        run: |
          xml=desktop/build/test-results/test/TEST-com.allmeyn.desktop.engine.NativeEngineTest.xml
          grep -o '<testsuite[^>]*>' "$xml"
          grep -q 'skipped="0"' "$xml" || { echo "NativeEngineTest was skipped: the DLL wasn't loaded"; exit 1; }
          grep -o 'Outputs:[^<]*' "$xml" || true
          grep -oE '[^>]*\.(flac|dsf): [^<]*' "$xml" || true

      # The packaged app (bundled Java runtime + DLL) must start and keep running: catches a runtime
      # module or resource missing from the distribution, which unit tests can't see.
      - name: Start the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/build/compose/binaries/main/app" -Recurse -Filter "All-Meyn Player.exe" | Select-Object -First 1
          if (-not $exe) { throw "packaged app not found" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the app exited after start (exit code $($p.ExitCode))" }
          Write-Host "App still running after 20 s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: all-meyn-player-windows
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/reports/tests/
