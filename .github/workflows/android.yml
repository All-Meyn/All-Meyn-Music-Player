name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Must match android.ndkVersion in app/build.gradle.kts (FFmpeg and the app share it).
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is preset).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Native host tests (ring buffer, PCM conversion, DSD)
        run: native-tests/run.sh

      - name: Install NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" "ndk;$NDK_VERSION" | tail -2

      - name: Cache FFmpeg (APE/WavPack)
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: app/src/main/cpp/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}-ndk-${{ env.NDK_VERSION }}

      - name: Build FFmpeg (APE/WavPack)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Check FFmpeg is present for every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "app/src/main/cpp/ffmpeg/$abi/lib/libavformat.a" || { echo "missing FFmpeg for $abi"; exit 1; }
          done

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: all-meyn-player-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
