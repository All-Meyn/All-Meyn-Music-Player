[versions]
# AGP 9 + Kotlin 2.4: what the LiquidGlass library (1.0) is built with; it needs compileSdk 37.
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
composeBom = "2026.04.01"
# The vendored FFmpeg decoder (app/src/main/cpp/media3_ffmpeg) must come from this same version.
# 1.9.1 hardened session Bundles sent by other apps.
media3 = "1.9.3"
liquidglass = "1.0.0"
# Compile-time nullness annotations the vendored Media3 FFmpeg decoder uses (Media3's own version).
checkerQual = "3.13.0"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# Liquid Glass look (Apache-2.0): the glass shader, and glass versions of the Material 3 components.
liquidglass = { group = "dev.shayxo.liquidglass", name = "liquidglass", version.ref = "liquidglass" }
liquidglass-material3 = { group = "dev.shayxo.liquidglass", name = "liquidglass-material3", version.ref = "liquidglass" }

checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checkerQual" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
